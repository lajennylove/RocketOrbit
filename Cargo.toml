[package]
name = "rocket-orbit"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079" }
propel_rocket = { git = "https://github.com/lajennylove/Propel", tag = "v0.2.0" }
